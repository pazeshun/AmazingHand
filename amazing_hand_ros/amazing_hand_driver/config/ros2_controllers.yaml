/**/controller_manager:
  ros__parameters:
    update_rate: 50
    joint_state_controller:
      type: joint_state_broadcaster/JointStateBroadcaster
    position_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/**/position_joint_trajectory_controller:
  ros__parameters:
    joints:
    - $(var side_prefix)index_flexion_level
    - $(var side_prefix)index_abduction_level
    - $(var side_prefix)middle_flexion_level
    - $(var side_prefix)middle_abduction_level
    - $(var side_prefix)ring_flexion_level
    - $(var side_prefix)ring_abduction_level
    - $(var side_prefix)thumb_flexion_level
    - $(var side_prefix)thumb_abduction_level
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.1
      $(var side_prefix)index_flexion_level:
        trajectory: 0.2
        goal: 0.03
      $(var side_prefix)index_abduction_level:
        trajectory: 0.2
        goal: 0.15
      $(var side_prefix)middle_flexion_level:
        trajectory: 0.2
        goal: 0.03
      $(var side_prefix)middle_abduction_level:
        trajectory: 0.2
        goal: 0.15
      $(var side_prefix)ring_flexion_level:
        trajectory: 0.2
        goal: 0.03
      $(var side_prefix)ring_abduction_level:
        trajectory: 0.2
        goal: 0.15
      $(var side_prefix)thumb_flexion_level:
        trajectory: 0.2
        goal: 0.03
      $(var side_prefix)thumb_abduction_level:
        trajectory: 0.2
        goal: 0.15
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
