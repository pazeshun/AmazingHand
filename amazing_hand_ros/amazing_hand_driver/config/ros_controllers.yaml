joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50
position_joint_trajectory_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - $(arg side_prefix)index_flexion_level
    - $(arg side_prefix)index_abduction_level
    - $(arg side_prefix)middle_flexion_level
    - $(arg side_prefix)middle_abduction_level
    - $(arg side_prefix)ring_flexion_level
    - $(arg side_prefix)ring_abduction_level
    - $(arg side_prefix)thumb_flexion_level
    - $(arg side_prefix)thumb_abduction_level
  state_publish_rate: 50
  action_monitor_rate: 20
  allow_partial_joints_goal: false
  constraints:
    goal_time: 2.0
    stopped_velocity_tolerance: 0.1
    $(arg side_prefix)index_flexion_level: {trajectory: 0.2, goal: 0.03}
    $(arg side_prefix)index_abduction_level: {trajectory: 0.2, goal: 0.15}
    $(arg side_prefix)middle_flexion_level: {trajectory: 0.2, goal: 0.03}
    $(arg side_prefix)middle_abduction_level: {trajectory: 0.2, goal: 0.15}
    $(arg side_prefix)ring_flexion_level: {trajectory: 0.2, goal: 0.03}
    $(arg side_prefix)ring_abduction_level: {trajectory: 0.2, goal: 0.15}
    $(arg side_prefix)thumb_flexion_level: {trajectory: 0.2, goal: 0.03}
    $(arg side_prefix)thumb_abduction_level: {trajectory: 0.2, goal: 0.15}
